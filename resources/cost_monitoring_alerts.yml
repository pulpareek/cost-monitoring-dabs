        pause_status: UNPAUSED

    # ============================================
    # Interactive Cluster Cost Alert (COST-007)
    # ============================================
    interactive_cost_alert:
      display_name: "Cost Alert - Interactive Clusters"
      custom_summary: *alert_subject
      custom_description: *alert_email_body

      # Interactive clusters = ALL_PURPOSE compute without job_id
      query_text: |
        SELECT
          COALESCE(SUM(u.usage_quantity * COALESCE(p.pricing.effective_list.default, p.pricing.default, 0)), 0) AS daily_cost
        FROM system.billing.usage u
