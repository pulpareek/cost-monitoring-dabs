# Cost Monitoring Alerts - Databricks Asset Bundle
#
# Uses native SQL Alerts V2 (DAB v0.279.0+) for cost monitoring.
# Schema validated against official Databricks documentation.

resources:
  alerts:
    # ============================================
    # AI/Model Serving Cost Alert
    # ============================================
    ai_cost_alert:
      display_name: "Cost Alert - AI Model Serving"
      custom_summary: &alert_subject "[Databricks Cost Alert] {{ALERT_NAME}} ({{ALERT_STATUS}})"
      custom_description: &alert_email_body |
        <h2>Databricks Cost Alert</h2>
        <p><b>{{ALERT_NAME}}</b> changed status to <b>{{ALERT_STATUS}}</b>.</p>
        <table>
          <tbody>
            <tr><th>Metric</th><td>{{ALERT_COLUMN}}</td></tr>
            <tr><th>Current value</th><td>{{QUERY_RESULT_VALUE}}</td></tr>
            <tr><th>Condition</th><td>{{ALERT_CONDITION}} {{ALERT_THRESHOLD}}</td></tr>
            <tr><th>Status</th><td>{{ALERT_STATUS}}</td></tr>
          </tbody>
        </table>
        <h3>Result details</h3>
        {{QUERY_RESULT_TABLE}}
        <hr>
        <p><a href="{{ALERT_URL}}" target="_blank">View this alert in Databricks</a></p>
        <p><i>Automated message from the cost-monitoring Databricks Asset Bundle. Thresholds are configured per environment.</i></p>

      query_text: |
        SELECT
          COALESCE(SUM(u.usage_quantity * COALESCE(p.pricing.effective_list.default, p.pricing.default, 0)), 0) AS daily_cost
        FROM system.billing.usage u
        INNER JOIN system.billing.list_prices p
          ON u.cloud = p.cloud
          AND u.sku_name = p.sku_name
          AND u.usage_start_time >= p.price_start_time
          AND (p.price_end_time IS NULL OR u.usage_end_time < p.price_end_time)
        WHERE u.usage_date = DATE_SUB(CURRENT_DATE(), 1)
          AND u.billing_origin_product = 'MODEL_SERVING'

      warehouse_id: ${var.warehouse_id}

      evaluation:
        comparison_operator: GREATER_THAN
        empty_result_state: OK
        source:
          name: daily_cost
        threshold:
          value:
            double_value: ${var.ai_daily_cost_threshold}
        notification:
          notify_on_ok: false
          retrigger_seconds: 0
          subscriptions:
            - user_email: ${var.alert_emails}

      schedule:
        quartz_cron_schedule: "0 0 13 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

