    # ============================================
    # Total Platform Cost Alert + Breakdown
    # ============================================
    total_cost_alert:
      display_name: "Cost Alert - Total Platform"
      custom_summary: *alert_subject
      custom_description: *alert_email_body

      # Includes breakdown by product for immediate context in alert
      query_text: |
        WITH per_product AS (
          SELECT
            u.billing_origin_product,
            SUM(u.usage_quantity * COALESCE(p.pricing.effective_list.default, p.pricing.default, 0)) AS cost
          FROM system.billing.usage u
          INNER JOIN system.billing.list_prices p
            ON u.cloud = p.cloud
            AND u.sku_name = p.sku_name
            AND u.usage_start_time >= p.price_start_time
            AND (p.price_end_time IS NULL OR u.usage_end_time < p.price_end_time)
          WHERE u.usage_date = DATE_SUB(CURRENT_DATE(), 1)
          GROUP BY u.billing_origin_product
        )
        SELECT
          COALESCE(SUM(cost), 0) AS total_cost,
          COALESCE(CONCAT_WS(', ', COLLECT_LIST(CONCAT(billing_origin_product, ': $', ROUND(cost, 0)))), 'None') AS breakdown
        FROM per_product

      warehouse_id: ${var.warehouse_id}

      evaluation:
        comparison_operator: GREATER_THAN
        empty_result_state: OK
        source:
          name: total_cost
        threshold:
          value:
            double_value: ${var.total_daily_cost_threshold}
        notification:
          notify_on_ok: false
          retrigger_seconds: 0
          subscriptions:
            - user_email: ${var.alert_emails}

      # Runs twice daily (1 PM and 7 PM UTC)
      schedule:
        quartz_cron_schedule: "0 0 13,19 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

    # ============================================
    # DLT Pipeline Cost Alert (COST-006)
    # ============================================
    dlt_cost_alert:
      display_name: "Cost Alert - DLT Pipelines"
      custom_summary: *alert_subject
      custom_description: *alert_email_body

      query_text: |
        SELECT
          COALESCE(SUM(u.usage_quantity * COALESCE(p.pricing.effective_list.default, p.pricing.default, 0)), 0) AS daily_cost
        FROM system.billing.usage u
